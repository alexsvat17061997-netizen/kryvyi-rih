<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E3576"><title>Кривий Ріг: виживи до зарплати</title>
<link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Golos+Text:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#F5E7CF;--panel:#FFF6E6;--text:#1F2350;--muted:#5A5C80;--line:#D9C6A6;--ind:#2E3576;--ver:#E4502E;--sun:#F2A93B;--vio:#5A3A8A;--cream:#F5E7CF;--ok:#3E9B4F;--bad:#C9412A;--display:'Unbounded',system-ui,sans-serif;--body:'Golos Text',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body{padding:calc(8px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
#app{max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;border:2px solid var(--line);border-radius:10px;padding:13px 16px;font-weight:600;text-align:left;margin:8px 0;background:var(--cream);color:var(--text)}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
.btn:disabled{opacity:.45}
.btn.main{border:0;background:var(--sun);color:#1F2350;font-family:var(--display);font-weight:800;text-align:center;font-size:17px}
.btn.ghost{background:transparent;border:2px solid var(--line);text-align:center}
h1,h2,h3{font-family:var(--display);margin:0}
/* шапка */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-bottom:6px}
.hdr{display:flex;align-items:center;gap:8px}
.hdr .av{width:44px;height:44px;border-radius:10px;object-fit:cover;border:2px solid var(--ver)}
.hdr .who{flex:1;min-width:0}.hdr .who b{font-family:var(--display);font-size:16px;display:block}.hdr .who span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hdr .ib{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-size:20px;position:relative}
.hdr .ib i{position:absolute;top:-6px;right:-6px;background:var(--ver);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 5px;min-width:18px}
.stats{display:flex;gap:6px;margin-top:6px}
.stats div{flex:1;background:var(--panel);border:2px solid var(--line);border-radius:10px;text-align:center;font-family:var(--display);font-weight:800;font-size:17px;padding:4px 0}
.stats div.low{border-color:var(--bad);color:var(--bad)}
.strip{display:flex;gap:6px;margin-top:6px}
.strip i{flex:1;font-style:normal;font-size:13px;text-align:center;padding:6px 2px;border-radius:999px;background:var(--panel);border:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip i.d{opacity:.55}.strip i.c{background:var(--sun);border-color:var(--sun);font-weight:700}
.line{margin-top:6px;background:var(--ind);color:#fff;border-radius:10px;padding:6px 10px;font-size:13px}
.line.warn{background:#7a2a1a}
.log{font-size:13px;color:var(--muted);margin:6px 2px}
/* картка */
.card{background:var(--ver);padding:8px;border-radius:12px;margin-top:8px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card .pic{width:100%;height:30vh;max-height:240px;min-height:150px;object-fit:cover;display:block;border-radius:8px 8px 0 0;background:#2c2450}
.card .sky{background:var(--ver);color:var(--cream);padding:10px 12px 8px}
.card .kick{font-size:13px;color:#FFE3B0;font-weight:600}
.chip{display:inline-block;background:var(--sun);color:#1F2350;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.card h2{font-size:21px;line-height:1.15;color:var(--cream)}
.card .body{background:var(--ind);color:#fff;padding:12px;border-radius:0 0 8px 8px}
.card .body p{margin:0 0 6px}
.card .body .btn{background:var(--cream);color:var(--text);border:0}
.card .body .btn.main{border:0;background:var(--sun)}
.fx{font-size:14px;font-weight:600}
.sum{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
/* карта */
.mapw{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;background:#2c2450}
.mapw img.m{width:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--text);border:2px solid var(--ind);border-radius:999px;font-size:12px;font-weight:700;padding:3px 8px;white-space:nowrap;border-style:solid}
.pin.here{background:var(--sun)}
.pin.sel{background:var(--ver);color:#fff;border-color:#fff}
.pin.off{opacity:.45}
.pin em{font-style:normal}
.hint{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.hint b{font-family:var(--display)}.hint span{font-size:13px;color:var(--muted)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:480px;margin:0 auto;background:var(--ind);color:#fff;border-radius:16px 16px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.35);max-height:78vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet .sh{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:17px;margin-bottom:6px}
.sheet .sh button{background:none;border:0;color:#fff;font-size:22px}
.sheet .btn{background:var(--cream);color:var(--text);border:0}
.sheet .note{font-size:13px;opacity:.85;margin:6px 0}
.sheet .back{background:none;border:0;color:#fff;width:100%;padding:10px;font-weight:700}
.shop{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.shop button{flex:1;min-width:46%;border:0;border-radius:10px;padding:8px;background:rgba(255,255,255,.12);color:#fff;text-align:left;font-size:13px}
.shop button b{display:block;font-size:14px}
.late small{color:#ffb3a3!important;font-weight:700}
.btn small.red{color:var(--bad);font-weight:700}
/* газета */
.paper{background:#fffaf0;border:3px solid var(--text);border-radius:6px;padding:10px;margin-top:8px}
.paper .mast{font-family:var(--display);font-size:26px;text-align:center;letter-spacing:1px}
.paper .no{text-align:center;font-size:12px;border-bottom:2px solid var(--text);padding-bottom:4px;margin-bottom:8px}
.paper img{width:100%;height:150px;object-fit:cover;border:2px solid var(--text)}
.paper h2{font-size:20px;margin:6px 0 2px}
.paper .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;font-weight:600;border-top:2px solid var(--text);margin-top:8px;padding-top:6px}
.effect{background:var(--ind);color:#fff;border-radius:10px;padding:10px;margin-top:8px}
/* меню */
.title{text-align:center;padding:20px 0}
.title h1{font-size:34px;line-height:1;color:var(--ind)}.title p{color:var(--muted)}
.modes .btn{background:var(--panel);border:2px solid var(--line)}
.modes .btn b{font-family:var(--display)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
/* міні-ігри */
#mg{position:fixed;inset:0;z-index:80;background:rgba(10,8,20,.75);display:flex;align-items:center;justify-content:center;padding:12px}
#mg .box{background:var(--bg);color:var(--text);border-radius:16px;padding:14px;width:100%;max-width:420px}
#mg .mh{display:flex;justify-content:space-between;align-items:center;font-family:var(--display)}
#mg .mh button{border:0;background:var(--panel);border-radius:8px;padding:4px 10px;font-size:13px}
#mg .msg{min-height:1.4em;font-weight:700;text-align:center;margin-top:6px}
.bar{height:6px;background:rgba(128,128,128,.3);border-radius:4px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--sun);width:100%}
.lad{position:relative;height:230px;margin:6px auto;max-width:260px;border-radius:12px;background:linear-gradient(#1b1f3b,#2c2450);overflow:hidden}
.lad.lit{background:linear-gradient(#5b5220,#3b3420)}
.lad .win{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:34px}
.lad .rail{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;top:46px;width:56px;border-left:5px solid #a9773b;border-right:5px solid #a9773b;display:flex;flex-direction:column-reverse;justify-content:space-between;padding:6px 0}
.lad .rail i{display:block;height:5px;background:#a9773b}
.lad .me{position:absolute;left:50%;transform:translateX(-50%);font-size:34px;transition:bottom .12s}
.lad .torch{position:absolute;right:10px;top:8px;font-size:30px;opacity:.15}.lad .torch.on{opacity:1}
.shake{animation:sh .3s}@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.two{display:flex;gap:8px}.two .btn{flex:1;text-align:center;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:16px;font-size:14px;font-weight:600;z-index:90;max-width:92vw;text-align:center;pointer-events:none;animation:in .2s}

/* телефон */
#phov{position:fixed;inset:0;z-index:60;background:rgba(10,8,20,.6);display:flex;align-items:flex-end;justify-content:center}
.phone{width:100%;max-width:480px;height:88vh;background:#151834;color:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden}
.phtop{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:13px;opacity:.9}.phtop button{background:none;border:0;color:#fff;font-size:20px}
.phhd{display:flex;align-items:center;gap:8px;padding:4px 14px 8px;font-family:var(--display);font-size:17px;border-bottom:1px solid rgba(255,255,255,.12)}.phhd button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:2px 10px;font-size:18px}
.phbody{flex:1;overflow:auto;padding:10px 14px 20px}
.phbody h4{margin:12px 0 6px;font-family:var(--display);font-size:14px}
.phbody .note{font-size:13px;opacity:.75;margin:4px 0}
.phapps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.phapps button{position:relative;background:rgba(255,255,255,.08);border:0;border-radius:16px;color:#fff;padding:14px 4px;font-size:13px}.phapps span{display:block;font-size:30px}
.phapps i,.phrow i{position:absolute;top:6px;right:8px;background:var(--ver);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 5px}
.phrow{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:rgba(255,255,255,.06);border:0;border-radius:12px;color:#fff;padding:8px;margin:6px 0;text-align:left}
.phrow img{width:42px;height:42px;border-radius:50%;object-fit:cover}.phrow span{flex:1;min-width:0}.phrow small{display:block;opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.phrow em{font-style:normal;font-weight:700}
.phrow:disabled{opacity:.45}
.thread{display:flex;flex-direction:column;gap:6px}
.bub{max-width:82%;background:rgba(255,255,255,.1);border-radius:14px;padding:8px 10px;font-size:14px;align-self:flex-start}
.bub.me{align-self:flex-end;background:#2f6fd6}
.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}.opts button,.wr button,.cb button{border:0;border-radius:10px;padding:8px 10px;background:var(--sun);color:#1F2350;font-weight:700;text-align:left}
.wr{margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding-top:8px;display:flex;flex-direction:column;gap:6px}.wr small{opacity:.7}
.back{background:none;border:0;color:#fff;width:100%;padding:10px;font-weight:700}
.ctp{display:flex;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px;margin:6px 0}.ctp img{width:52px;height:52px;border-radius:50%;object-fit:cover}.ctp>div{flex:1}.ctp b{display:block}.ctp span{display:block;font-size:13px}.ctp .tn{color:var(--sun);font-weight:700}.ctp small{opacity:.7}
.cb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.cb button{font-size:13px;padding:6px 10px}.cb button:disabled{opacity:.5}
.pin em{font-style:normal}

.chart{margin:10px 0;padding:10px;border-radius:12px;background:rgba(0,0,0,.04)}.chart svg{width:100%;height:100px;display:block;margin:6px 0}.chart polyline{fill:none;stroke:var(--sun,#f5b400);stroke-width:3;stroke-linejoin:round}.chart circle{fill:var(--sun,#f5b400)}.chart .z{stroke:#c33;stroke-dasharray:4 4;stroke-width:1}.chart small{opacity:.7}
#mg .stage{position:relative}#mg .small{font-size:13px;text-align:center;margin:6px 0}#mg .q{margin:6px 0}
#mg .btn.good{background:var(--ok);color:#fff}#mg .btn.badx{background:var(--bad);color:#fff}#mg .big{font-size:22px;padding:18px}
.pond,.hag,.pet,.field,.pot,.road,.run,.chase,.sky2{position:relative;border-radius:12px;overflow:hidden;margin:6px 0;user-select:none;-webkit-user-select:none}
.pond{height:150px;background:linear-gradient(#7fb6d8,#2f6f9a)}.pond .fl{position:absolute;left:10px;top:8px;font-size:34px}.pond .flt{position:absolute;left:58%;top:52%;font-size:22px;transition:transform .12s}.pond .flt.dip{transform:translateY(16px) scale(.7)}
.hag{height:44px;background:#e8d9bd;border:2px solid var(--line)}.hag .zone{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.8}.hag .nd{position:absolute;top:-2px;bottom:-2px;width:4px;background:var(--text);margin-left:-2px}
.pet{height:150px;background:#f3dcc0;text-align:center}.pet .cat{font-size:80px;display:inline-block;margin-top:20px}.pet .cat.pur{animation:pur .25s}.pet .tail{position:absolute;right:24%;bottom:30px;font-size:30px;opacity:.3}.pet .tail.on{opacity:1;animation:sh .25s infinite}
@keyframes pur{50%{transform:scale(1.08)}}
.grid9{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid9 button,.grid4 button,.pad button{font-size:32px;padding:10px 0;border-radius:10px;border:2px solid var(--line);background:var(--panel)}.grid9 .wig{animation:sh .2s 2}.grid9 .hit{background:var(--ok)}.grid9 .no{opacity:.35}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.field{height:260px;background:linear-gradient(#9dc183,#6f9a55)}.field .hero,.field .ob{position:absolute;transform:translateX(-50%);font-size:32px}.field .hero{bottom:6%}.field .ob{top:-10%}
.pot{height:120px;background:#3a2f4f;color:#fff;text-align:center;font-size:44px}.pot .rec{font-size:28px;letter-spacing:4px}.pot .dima{position:absolute;right:-90px;top:10px;font-size:34px;transition:right .3s;cursor:pointer}.pot .dima.on{right:10px}
.road{height:110px;background:linear-gradient(#ffcf87 60%,#555 60%)}.road .stop{position:absolute;left:66%;top:20px;font-size:34px}.road .van{position:absolute;bottom:6px;font-size:40px;transform:translateX(-50%) scaleX(-1)}
.run{height:130px;background:linear-gradient(#c9e4f5 70%,#8a8f99 70%)}.run .me{position:absolute;left:14%;font-size:34px;transform:scaleX(-1)}.run .tr{position:absolute;right:4px;bottom:8px;font-size:40px}.run .ob{position:absolute;bottom:6px;font-size:26px}
.chase{height:90px;background:#2c2450}.chase .me,.chase .bad{position:absolute;bottom:14px;font-size:36px;transform:scaleX(-1);transition:left .08s}.chase .me{left:30%}.chase .bad{left:6%}
.disp{font-size:34px;text-align:center;font-weight:800;letter-spacing:4px;margin:6px 0}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pad button{font-size:24px}
.sky2{height:260px;background:linear-gradient(#7ec3f0,#d7f0ff 70%,#9cc96b 70%)}.sky2 .chute{position:absolute;font-size:36px;transform:translateX(-50%)}.sky2 .tgt{position:absolute;bottom:6%;font-size:30px;transform:translateX(-50%)}.sky2 .wind{position:absolute;right:8px;top:6px;font-size:20px}
.lab .row{display:flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0}.lab .row>span{font-size:28px}.lab .row div{flex:1}.lab .row small{display:block;font-size:12px;opacity:.75}.lab .row em{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--ok)}.lab .row button{border:0;background:var(--sun);border-radius:8px;padding:8px 12px;font-weight:700}
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.pchips span{font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px 8px}.pchips span.on{background:var(--sun);font-weight:700}.pchips span.fin{opacity:.5}
.prow{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}.prow small{opacity:.8}
.wait{text-align:center;background:var(--ind);color:#fff;border-radius:16px;padding:22px 12px;margin:10px 0}.wait b{display:block;font-size:18px}.wait small{opacity:.8}.wait .sp{font-size:40px;animation:pur 1.2s infinite}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0}.chat .cl{max-height:150px;overflow:auto;font-size:13px;margin:6px 0}.chat .ci{display:flex;gap:6px}.chat input{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;padding:8px;font:inherit}.chat .ci button{border:0;background:var(--sun);border-radius:8px;padding:0 14px;font-weight:700}
.gg{background:var(--cream);border:2px solid var(--sun);border-radius:12px;padding:10px;margin:10px 0}.gg>b{display:block;font-family:var(--display)}.gg small{display:block;opacity:.8;margin:4px 0}
.inp{display:block;width:100%;border:2px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin:6px 0;background:#fff}.inp.big{font-size:24px;text-align:center;letter-spacing:6px}
.code{font-family:var(--display);font-size:40px;letter-spacing:8px;color:var(--ver)}.red{color:var(--bad)}
.pen{position:relative;height:170px;border-radius:12px;overflow:hidden;background:linear-gradient(#4f8f3a,#3d7a2c)}.pen .goal{position:absolute;left:8%;right:8%;top:8px;height:60px;border:4px solid #fff;border-bottom:0}.pen .keep{position:absolute;top:30px;font-size:30px;transform:translateX(-50%)}.pen .aim{position:absolute;top:80px;font-size:20px;transform:translateX(-50%)}.pen .ball{position:absolute;bottom:8px;left:50%;font-size:28px;transform:translateX(-50%)}.pen .ball.fly{animation:fly .4s forwards}@keyframes fly{to{bottom:110px}}

.v1 { --ver: #E4502E; --sun: #F2A93B; --ind: #2E3576; --vio: #5A3A8A; --cream: #F5E7CF; --bg: #F5E7CF; --text: #1F2350; --muted: #5A5C80; --panel: #FFF6E6; --line: #D9C6A6; --display: "Unbounded","Arial Black",system-ui,sans-serif; --body: "Golos Text","Segoe UI",Roboto,system-ui,sans-serif; }
@media (prefers-color-scheme: dark){.v1 :not([data-theme="light"]) { --bg: #191C42; --text: #F5E7CF; --muted: #B9B5D6; --panel: #232858; --line: #3A4080; }}
.v1 { box-sizing: border-box; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
.v1 { scroll-padding-top: env(safe-area-inset-top,0px); }
.v1 *, .v1 ::before, .v1 ::after { box-sizing: inherit; }
.v1 { margin: 0px; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.v1 .tscr { max-width: 480px; margin: 0px auto; padding: 16px 16px 40px; }
.v1 h1, .v1 h2, .v1 h3 { font-family: var(--display); margin: 0px; line-height: 1.15; }
.v1 button { font: inherit; cursor: pointer; }
@keyframes flip { 
  0% { transform: translateY(8px) rotate(-1deg); opacity: 0; }
  100% { transform: none; opacity: 1; }
}
.v1 details.mapbox { margin-top: 12px; background: var(--panel); border: 2px solid var(--line); border-radius: 6px; overflow: hidden; }
.v1 details.mapbox summary { padding: 10px 12px; font-weight: 600; cursor: pointer; }
.v1 .note { font-size: 14px; color: rgb(255, 227, 176); }
@keyframes fly { 
  0% { opacity: 0; transform: translateY(6px); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-18px); }
}
@keyframes shake { 
  0%, 100% { transform: none; }
  20% { transform: translateX(-6px) rotate(-0.6deg); }
  40% { transform: translateX(6px) rotate(0.6deg); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}
.v1 .stephead { margin: 4px 0px 12px; }
.v1 .stephead h2 { font-size: 22px; margin-top: 2px; }
@keyframes snowfall { 
  0% { background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px; }

function playMg(k,cb,opt){if(k==='ladder')return mgLadder(cb);const g=MG[k];const f=k==='quiz'?gQuiz(opt.qs):k==='dial'?((s,d)=>gDial(s,d,opt.num)):g.f;
 mgFrame(k==='dial'&&opt.num?'Набери '+opt.num:g.n,k==='dial'&&opt.num?`Руки трусяться, цифри скачуть. Швидко набери <b>${opt.num}</b>!`:g.i,f,r=>cb(r),{noSkip:!!(opt&&opt.noSkip)});}

// ===================== Кривий Ріг 3.0 · гра з друзями =====================
'use strict';
// P — спільна гра: у кожного гравця свій G (свій Студент), календар спільний.
// Хто ходить: усі, у кого календар (день+вихідні) найменший і хто ще не закінчив цей день.
let P=null,NET=null,ROOM=null;
const PARTY_KEY='kr3-party';
const QS=new URLSearchParams(location.search);
const MYDEV=(()=>{if(QS.get('dev'))return QS.get('dev');try{let d=localStorage.getItem('kr3-dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem('kr3-dev',d);}return d;}catch(e){return 'd'+Math.random().toString(36).slice(2,8);}})();
function lsG(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsS(k,v){try{localStorage.setItem(k,v);}catch(e){}}

// ---------- календар і черга ----------
function cal(g){if(!g||g.phase==='end')return 1e9;return g.day*3+(g.wk||0)+(g.phase==='payday'?1:0);}
function alive(){return P.pl.filter(p=>!p.fin);}
function useP(i){P.cur=i;G=P.pl[i].G;if(P.family&&P.money!=null)G.money=P.money;}
function iOwn(i){return !P||!P.online||P.pl[i].dev===MYDEV;}
function iOwnCur(){return !P||iOwn(P.cur);}
function amHost(){return !P||!P.online||(ROOM&&ROOM.role==='host');}
function pSave(){if(!P||P.online)return;try{localStorage.setItem(PARTY_KEY,JSON.stringify(P));}catch(e){}}
function hasPartySave(){return !!lsG(PARTY_KEY);}
function newParty(seats,mode,online,family,season,weeks){P={v:3,mode,weeks:weeks||null,online:!!online,family:!!family,season:season||'life',pl:[],cur:0,phase:null,loans:[],chat:[],gg:null,nights:0,calNow:0};
 seats.forEach(s=>{G=null;newGame(mode,null,{season:season||'life',weeks:weeks||null});P.pl.push({name:s.name,dev:s.dev||MYDEV,G,done:false,fin:false});});
 // один світ на всіх: дата, пора року й погода — як у першого гравця
 const W0=P.pl[0].G;P.pl.forEach(q=>{q.G.date0=W0.date0;q.G.season=W0.season;q.G.wxd=W0.wxd.slice();q.G.news=JSON.parse(JSON.stringify(W0.news));});
 if(P.family){P.money=P.pl.reduce((s,q)=>s+q.G.money,0);const fd={t:'Всією сімʼєю на море',cost:r10(P.pl.reduce((s,q)=>s+q.G.dream.cost,0)*0.8)};P.pl.forEach(q=>{q.G.dream=fd;q.G.money=P.money;});}
 P.calNow=0;useP(0);P.phase=online?null:'pass';pSave();}
// після кожної дії: чи не закінчив поточний гравець свій день (поїхав до мами, кінцівка тощо)
function pCheck(){if(P&&P.family&&amHost())famSync();if(!P||P.phase||!amHost())return;const p=P.pl[P.cur];if(!p||p.done||p.fin)return;
 if(G.phase!=='end'&&cal(G)>P.calNow){p.done=true;pNext();}}
function pNext(){const A=alive();if(!A.length){P.phase='final';pSave();return;}
 const nx=A.find(p=>!p.done&&cal(p.G)===P.calNow);
 if(nx){useP(P.pl.indexOf(nx));P.phase=P.online?null:'pass';if(P.online)toastLater(`Хід: ${nx.name}`);pSave();return;}
 // усі прожили цей день → спільний вечір
 P.phase='together';P.nights++;P.gg=null;P.ggOffer=P.nights%2===0?['pen','quiz','auc','bus'][(P.nights/2-1)%4]:null;pSave();}
function sleepAll(){P.pl.forEach((p,i)=>{if(p.fin||!p.done)return;if(cal(p.G)===P.calNow&&p.G.phase==='evening'){useP(i);sleep();}});
 P.pl.forEach(p=>p.done=false);const A=alive();if(!A.length){P.phase='final';pSave();return;}
 P.calNow=Math.min(...A.map(p=>cal(p.G)));P.phase=null;const nx=A.find(p=>cal(p.G)===P.calNow);useP(P.pl.indexOf(nx));P.phase=P.online?null:'pass';pSave();}
function pScore(p){const g=p.G;const rel=DP.order.reduce((s,k)=>s+g.rel[k].r,0);const debt=P.loans.filter(l=>l.t===P.pl.indexOf(p)).reduce((s,l)=>s+l.m,0);
 return Math.round(g.money-debt+g.happy*20+g.nerves*15+rel*40+(g.dreamOk?500:0));}

// ---------- кліки в спільній грі ----------
const LOCAL_A=['pin','x','back','phone','ph','phx','foot','labplay','party','hot','hostmk','joinmk','tomenu','newgame','mode','pet','gate','continue','resetrel','pcont','hotn','hostmode'];
function partyClick(ds){const a=ds.a;
 // меню гри з друзями (без P)
 if(a==='party'){UI.menu='party';render();return true;}
 if(a==='hot'){UI.menu='hot';UI.hn=UI.hn||2;render();return true;}
 if(a==='hotn'){UI.hn=+ds.k;render();return true;}
 if(a==='hotgo'&&ds.k==='hard'&&!ds.ok){UI.hnames=[...document.querySelectorAll('[data-in^=n]')].map(x=>x.value);UI.hh={weeks:(UI.hh||{}).weeks||1,season:(UI.hcfg||{}).season||'life'};hardSheet('hot');return true;}
 if(a==='hotgo'){const seats=[];for(let i=0;i<(UI.hn||2);i++)seats.push({name:(ds['in_n'+i]||'').trim().slice(0,14)||('Гравець '+(i+1))});newParty(seats,ds.k||'fast',false,!!UI.fam,(UI.hcfg||{}).season,ds.k==='hard'?(UI.hh||{}).weeks||1:null);UI.menu='title';render();window.scrollTo(0,0);return true;}
 if(a==='pcont'){try{P=JSON.parse(lsG(PARTY_KEY));useP(P.cur);}catch(e){P=null;}render();return true;}
 if(a==='hostmk'){const nm=(document.querySelector('[data-in=name]')||{}).value;if(nm)lsS('kr3-name',nm.trim().slice(0,14));roomHost();render();return true;}
 if(a==='joinmk'){UI.menu='join';render();return true;}
 if(a==='joingo'){if(ds.in_name)lsS('kr3-name',ds.in_name.trim().slice(0,14));roomJoin(ds.in_code);render();return true;}
 if(a==='hostmode'){if(ROOM&&ds.k==='hard'){UI.hh={weeks:ROOM.weeks||1,season:ROOM.season||'life'};hardSheet('room');return true;}if(ROOM){ROOM.mode=ds.k;ROOM.weeks=null;hostLobby();}render();return true;}
 if(a==='hostwx'){if(ROOM){ROOM.season=ds.k;hostLobby();}render();return true;}
 if(a==='hostfam'){if(ROOM){ROOM.family=!ROOM.family;hostLobby();}render();return true;}
 if(a==='hoststart'){roomStart();return true;}
 if(a==='roomleave'){roomLeave();UI.menu='title';render();return true;}
 if(!P)return false;
 if(a==='ggplay'){if(P.gg&&!P.gg.res&&iOwn(P.gg.turn))ggPlay(P.gg.k,sc=>fire({a:'ggres',v:sc}));return true;}
 // гість онлайн: свої екранні дії — тут, решта — ведучому
 if(P.online&&ROOM&&ROOM.role==='guest'){
  if(LOCAL_A.includes(a)&&a!=='tomenu')return false;
  if(a==='menu'||a==='tomenu'||a==='pexit'){roomLeave();P=null;G=null;UI.menu='title';render();return true;}
  if((a==='act'||a==='meet')&&G&&UI.sheet&&stops(G.pos,UI.sheet)>0){UI.road=a==='meet'?'meet:'+ds.k:ds.k;render();return true;}
  const msg=Object.assign({},ds,{sheet:UI.sheet,road:UI.road});NET&&NET.send('host',{t:'click',ds:msg});
  if(['act','go','meet'].includes(a)){UI.sheet=null;UI.road=null;}
  return true;}
 if(P.online&&!LOCAL_A.includes(a)&&!['chat','menu','pexit'].includes(a)&&!perm(MYDEV,ds)){toastLater('Зараз не твій хід');render();return true;}
 return pApply(ds);}
// дії, які змінюють спільну гру (на ведучому або за одним телефоном). true — оброблено
function pApply(ds){const a=ds.a;
 switch(a){
  case 'menu':case 'pexit':if(P.online)roomLeave();P=null;G=null;UI.menu='title';render();return true;
  case 'pgo':P.phase=null;render();window.scrollTo(0,0);return true;
  case 'sleep':if(P.phase)return true;if(!G.evDone)return true;P.pl[P.cur].done=true;pNext();render();window.scrollTo(0,0);return true;
  case 'pdone':P.pl[P.cur].fin=true;P.pl[P.cur].done=true;pNext();render();window.scrollTo(0,0);return true;
  case 'again':case 'tomenu':if(G&&G.phase==='end'&&!P.pl[P.cur].fin)return pApply({a:'pdone'});if(P.phase==='final'){if(P.online)roomLeave();try{localStorage.removeItem(PARTY_KEY);}catch(e){}P=null;G=null;UI.menu='title';render();return true;}return false;
  case 'loan':{const f=+ds.f,t=+ds.t;const F=P.pl[f].G,T=P.pl[t].G;if(F.money<150)return true;F.money-=100;T.money+=100;P.loans.push({f,t,m:100});pChat(`🤝 ${P.pl[f].name} → ${P.pl[t].name}: позика 100 грн`);pSave();render();return true;}
  case 'repay':{const n=+ds.i;const l=P.loans[n];if(!l)return true;const T=P.pl[l.t].G;if(T.money<l.m)return true;T.money-=l.m;P.pl[l.f].G.money+=l.m;P.loans.splice(n,1);pChat(`✅ ${P.pl[l.t].name} → ${P.pl[l.f].name}: борг повернуто`);pSave();render();return true;}
  case 'chat':pChat(`${P.online?nameOf(ds._dev||MYDEV):''}: ${ds.v}`);render();return true;
  case 'sleepall':sleepAll();render();window.scrollTo(0,0);return true;
  case 'ggstart':ggStart(P.ggOffer);render();return true;
  case 'ggskip':P.ggOffer=null;render();return true;
  case 'ggres':ggResult(+ds.v);render();return true;
  case 'bid':ggResult(+ds.v);render();return true;
  case 'ggend':P.gg=null;P.ggOffer=null;render();return true;}
 return false;}
function nameOf(dev){const p=P&&P.pl.find(x=>x.dev===dev);return p?p.name:'?';}
function pChat(t){P.chat.push(t);if(P.chat.length>40)P.chat.shift();}
// хто що може натискати онлайн
function perm(dev,ds){const a=ds.a;if(['chat','menu','pexit'].includes(a))return true;
 if(P.phase==='together'){if(a==='loan')return P.pl[+ds.f].dev===dev;if(a==='repay'){const l=P.loans[+ds.i];return l&&P.pl[l.t].dev===dev;}
  if(P.gg){if(['ggres','bid'].includes(a))return P.pl[P.gg.turn].dev===dev;if(a==='ggend')return true;return false;}
  return ['sleepall','ggstart','ggskip'].includes(a);}
 if(P.phase==='final')return true;
 return P.pl[P.cur].dev===dev;}

// ---------- ігри на всіх ----------
const GG={pen:{ic:'⚽',n:'Пенальті',i:'3 удари. Стрілка бігає — тисни «Удар!», коли вона далеко від воротаря.'},
 quiz:{ic:'❓',n:'Вікторина про Кривий Ріг',i:'3 питання про рідне місто, по 8 секунд.'},
 auc:{ic:'🔨',n:'Аукціон на ринку',i:'Кожен таємно ставить гроші. Хто дав найбільше — забирає лот.'},
 bus:{ic:'🚐',n:'Остання маршрутка',i:'Одна спроба: махни якомога точніше, коли маршрутка біля 🚏.'}};
function ggStart(k){if(!k)return;const A=alive().map(p=>P.pl.indexOf(p));P.gg={k,order:A,pos:0,turn:A[0],sc:{},lot:k==='auc'?pick(DQ.lots):null,qs:k==='quiz'?DQ.quiz.slice().sort(()=>Math.random()-.5).slice(0,3):null,shown:false,res:null};}
function ggResult(v){const g=P.gg;if(!g||g.res)return;g.sc[g.turn]=v;g.pos++;g.shown=false;
 if(g.pos<g.order.length){g.turn=g.order[g.pos];return;}
 // підсумок
 const best=Math.max(...g.order.map(i=>g.sc[i]||0));const W=g.order.filter(i=>(g.sc[i]||0)===best&&best>0);let txt='';
 if(g.k==='auc'){if(W.length===1){const w=P.pl[W[0]];const L=g.lot;w.G.money-=best;if(L.item==='jars')w.G.jars+=4;else if(L.item)w.G.items[L.item]=1;if(L.d)Object.keys(L.d).forEach(x=>{if(x==='h')w.G.happy+=L.d.h;});txt=`🔨 ${w.name} забирає «${L.t}» за ${best} грн`;}else txt=W.length?'🤝 Нічия — лот лишився в продавця':'Ніхто не ставив — лот лишився в продавця';}
 else if(W.length){W.forEach(i=>P.pl[i].G.happy+=2);txt=`🏆 ${W.map(i=>P.pl[i].name).join(', ')}: +2 😊`;}else txt='Ніхто не переміг';
 g.res=txt;pChat(GG[g.k].ic+' '+txt);pSave();}
// гра з рахунком; cb(рахунок)
function ggPlay(k,cb){const g=P.gg;let sc=0;
 const runs={pen:(s,d)=>gPen(s,d,x=>sc=x),quiz:gQuiz(g.qs,x=>sc=x),bus:(s,d)=>gBusR(s,d,x=>sc=x)};
 mgFrame(GG[k].n,GG[k].i,runs[k],()=>cb(sc),{noSkip:true});}
function gPen(stage,done,onScore){let shot=0,goals=0,over=false,x=50,v=0.6,kx=50,kv=0.35;
 const w=el(`<div class="pen"><span class="goal"></span><span class="keep">🧤</span><span class="aim">⬇️</span><span class="ball">⚽</span></div><p class="small">Удар <b>1</b>/3 · голів <i>0</i></p><button class="btn main" style="text-align:center">⚽ Удар!</button>`);stage.appendChild(w);
 const kp=w.querySelector('.keep'),am=w.querySelector('.aim'),bl=w.querySelector('.ball'),sb=w.querySelector('b'),gi=w.querySelector('i');
 const f=()=>{if(over)return;x+=v;if(x>92||x<8)v=-v;kx+=kv;if(kx>80||kx<20)kv=-kv;am.style.left=x+'%';kp.style.left=kx+'%';requestAnimationFrame(f);};requestAnimationFrame(f);
 w.querySelector('button').onclick=e=>{e.stopPropagation();if(over)return;shot++;const goal=Math.abs(x-kx)>13;if(goal)goals++;bl.style.left=x+'%';bl.classList.remove('fly');void bl.offsetWidth;bl.classList.add('fly');gi.textContent=goals;
  if(shot>=3){over=true;onScore(goals);return done(goals>=2,`Голів: ${goals} з 3`);}sb.textContent=shot+1;v*=1.25;kv*=1.3;};
 return ()=>{over=true;};}
function gBusR(stage,done,onScore){const w=el(`<div class="road"><span class="stop">🚏</span><span class="van">🚐</span></div><p class="small">Одна спроба!</p><button class="btn main" style="text-align:center">🙋 Махнути!</button>`);stage.appendChild(w);
 const van=w.querySelector('.van');let x=-10,over=false;const sp=R_(0.45,0.7);
 const f=()=>{if(over)return;x+=sp;if(x>110){over=true;onScore(0);return done(false,'Проїхала повз!');}van.style.left=x+'%';requestAnimationFrame(f);};requestAnimationFrame(f);
 w.querySelector('button').onclick=e=>{e.stopPropagation();if(over)return;over=true;const s=Math.max(0,Math.round(100-Math.abs(x-66)*5));onScore(s);done(s>=50,`Точність: ${s} очок`);};
 return ()=>{over=true;};}

 if(G&&G.phase==='end'){return v1End().replace('data-a="again">🔁 Ще раз','data-a="pdone">Далі →');}
 return '';}

function togetherScreen(){const g=P.gg;let h=`<div class="title"><h1>🌙 Вечір разом</h1><p>${esc(DOW[(P.pl.find(p=>!p.fin)||P.pl[0]).G.day%5])}${P.pl.some(p=>p.G.wk)?' · вихідні':''}</p></div>`;
 h+=`<div class="sum">${P.pl.map((p,i)=>{const G0=p.G;const away=!p.fin&&cal(G0)>P.calNow;return `<div class="prow"><b>${esc(p.name)}</b> ${p.fin?'🏁 вже фінішував':away?'🏠 у мами':''}<br>💰 ${G0.money} · 😌 ${G0.nerves} · 😊 ${G0.happy}${G0.dream?` · мрія ${G0.dream.cost} грн`:''}</div>`;}).join('')}</div>`;
 if(g)return h+ggScreen()+chatHTML();
 // позики
 const A=alive();let L='';if(!P.family)A.forEach(p=>{const f=P.pl.indexOf(p);if(p.G.money<150)return;const poor=A.filter(q=>q!==p).sort((x,y)=>x.G.money-y.G.money)[0];if(!poor)return;const t=P.pl.indexOf(poor);
  L+=`<button class="btn" data-a="loan" data-f="${f}" data-t="${t}" ${iOwn(f)?'':'disabled'}>🤝 ${esc(p.name)} → ${esc(poor.name)}: позичити 100 грн<small>поверне, коли зможе</small></button>`;});
 P.loans.forEach((l,n)=>{const T=P.pl[l.t];L+=`<button class="btn" data-a="repay" data-i="${n}" ${T.G.money>=l.m&&iOwn(l.t)?'':'disabled'}>💸 ${esc(T.name)} → ${esc(P.pl[l.f].name)}: віддати борг ${l.m} грн<small>${T.G.money>=l.m?'гроші є':'поки не вистачає'}</small></button>`;});
 if(L)h+=`<h4>💰 Гроші між своїми</h4>`+L;
 if(P.ggOffer){const o=GG[P.ggOffer];h+=`<div class="gg"><b>${o.ic} Гра на всіх: ${o.n}</b><small>${o.i} Переможцю +2 😊.</small><div class="two"><button class="btn main" data-a="ggstart">Граємо!</button><button class="btn" data-a="ggskip">Не сьогодні</button></div></div>`;}
 return h+chatHTML()+`<button class="btn main" data-a="sleepall">😴 Усім спати</button>`;}
function ggScreen(){const g=P.gg;const o=GG[g.k];
 if(g.res)return `<div class="gg"><b>${o.ic} ${o.n}</b>${g.order.map(i=>`<div>${esc(P.pl[i].name)}: ${g.k==='auc'?(g.sc[i]||0)+' грн':(g.sc[i]||0)+(g.k==='bus'?' очок':g.k==='pen'?' гол.':' з 3')}</div>`).join('')}<p><b>${esc(g.res)}</b></p><button class="btn main" data-a="ggend">Далі</button></div>`;

const PEER_CFG={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}]}};
function loadPeer(){if(window.Peer)return Promise.resolve();const src=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'];
 return new Promise((res,rej)=>{let i=0;const one=()=>{if(i>=src.length)return rej('load');const s=document.createElement('script');s.src=src[i++];s.onload=()=>window.Peer?res():one();s.onerror=one;document.head.appendChild(s);};one();});}
const CHUNK=12000;let _cid=0;
function pSend(c,m){if(!c||!c.open)return;const s=JSON.stringify(m);try{if(s.length<=CHUNK){c.send(m);return;}const id=(++_cid)+'-'+Math.random().toString(36).slice(2,6),n=Math.ceil(s.length/CHUNK);for(let i=0;i<n;i++)c.send({t:'chunk',id,i,n,d:s.slice(i*CHUNK,(i+1)*CHUNK)});}catch(e){}}
function pRecv(c,m,cb){if(!m||m.t!=='chunk')return cb(m);c._ch=c._ch||{};const b=c._ch[m.id]=c._ch[m.id]||{n:m.n,p:[],k:0};if(b.p[m.i]==null){b.p[m.i]=m.d;b.k++;}if(b.k===b.n){delete c._ch[m.id];let o=null;try{o=JSON.parse(b.p.join(''));}catch(e){}if(o)cb(o);}}
function netPeer(){const conns={};let peer=null,conn=null;
 return {host(code,cb){loadPeer().then(()=>{peer=new Peer('kr3-kryvbas-'+code,PEER_CFG);peer.on('open',()=>cb.status('open'));peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});peer.on('error',e=>cb.error(e.type||'error'));
   peer.on('connection',c=>{c.on('data',raw=>pRecv(c,raw,m=>{if(m&&m.t==='hello'){conns[m.dev]=c;c._dev=m.dev;}cb.msg(c._dev,m);}));c.on('close',()=>{if(c._dev&&conns[c._dev]===c){delete conns[c._dev];cb.left(c._dev);}});});},()=>cb.error('load'));},
  join(code,dev,cb){loadPeer().then(()=>{peer=new Peer(undefined,PEER_CFG);peer.on('error',e=>cb.error(e.type||'error'));
   peer.on('open',()=>{conn=peer.connect('kr3-kryvbas-'+code,{reliable:true,serialization:'json'});conn.on('open',()=>{pSend(conn,{t:'hello',dev,name:lsG('kr3-name')||'Гість'});cb.status('open');});conn.on('data',raw=>pRecv(conn,raw,m=>cb.msg('host',m)));conn.on('close',()=>cb.status('lost'));});},()=>cb.error('load'));},
  send(dev,m){pSend(dev==='host'?conn:conns[dev],m);},all(m){Object.values(conns).forEach(c=>pSend(c,m));},close(){try{peer&&peer.destroy();}catch(e){}}};}
function netBC(){let ch=null,me=null;
 return {host(code,cb){ch=new BroadcastChannel('kr3-room-'+code);me='host';ch.onmessage=e=>{const d=e.data;if(d.to==='host')cb.msg(d.from,d.m);};setTimeout(()=>cb.status('open'),10);},

  send(to,m){ch&&ch.postMessage({to,from:me,m:JSON.parse(JSON.stringify(m))});},all(m){ch&&ch.postMessage({to:'*',from:me,m:JSON.parse(JSON.stringify(m))});},close(){try{ch&&ch.close();}catch(e){}}};}

var CRISES=[{k:'flu',t:'Епідемія грипу',x:'Пів міста на лікарняному. Поки не сходиш у поліклініку, щоранку −1 нерв.'},{k:'prices',t:'Ціни злетіли',x:'Три дні все на 25% дорожче: від хліба до таксі.'},{k:'blackout',t:'Блекаут',x:'Три дні графіки відключень: вечеря дорожча на 40 грн, а без павербанка щовечора −1 нерв.'},{k:'cuts',t:'Скорочення стипендій',x:'Цього тижня стипендія буде на 20% меншою.'},{k:'crime',t:'Хвиля крадіжок',x:'Три дні місто неспокійне: жорстких пригод більше.'},{k:'water',t:'Аварія на водоканалі',x:'Три дні без води: щоранку −1 нерв і 30 грн на воду в пляшках.'}];
function crisisNow(){if(!G||!G.hard||!G.crisis)return null;const c=G.crisis;return (G.day>=c.from&&G.day<c.from+3)||c.k==='cuts'&&Math.floor(G.day/5)===Math.floor(c.from/5)?CRISES.find(x=>x.k===c.k):null;}
function crisisMorning(msg){if(!G.hard||G.wk)return;const w=Math.floor(G.day/5);if(G.crisisW!==w){G.crisisW=w;const used=G.crisisU||[];const pool=CRISES.filter(c=>!used.includes(c.k));const c=pick(pool.length?pool:CRISES);G.crisis={k:c.k,from:w*5+Math.floor(rnd()*3)};G.crisisU=used.concat(c.k);}
 const c=crisisNow();if(!c)return;if(G.day===G.crisis.from)msg.push(`🔥 Криза: ${c.t}. ${c.x}`);
 if(c.k==='flu'&&!G.fluOk){add({n:-1});msg.push('🤒 Грип: −1 нерв (поліклініка допоможе)');}if(c.k==='water'){add({n:-1,m:-30});msg.push('🚱 Без води: −1 нерв, −30 грн');}}
function crisisPrice(m){const c=crisisNow();return c&&c.k==='prices'&&m<0?r10(m*1.25):m;}
